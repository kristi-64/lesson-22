<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>პროდუქტების მართვა</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-layout">
      <section class="card-section">
        <form id="add-form">
          <h2 id="form-title">ახალი პროდუქტის დამატება</h2>

          <div class="form-group">
            <label for="title">სათაური</label>
            <input
              type="text"
              id="title"
              placeholder="მაგ: iPhone 15 Pro"
              required
            />
          </div>

          <div class="form-group">
            <label for="price">ფასი ($)</label>
            <input
              type="number"
              id="price"
              step="0.01"
              placeholder="999"
              required
            />
          </div>

          <div class="form-group">
            <label for="discount">ფასდაკლება (%)</label>
            <input type="number" id="discount" step="0.1" placeholder="10" />
          </div>

          <div class="form-group">
            <label for="category">კატეგორია</label>
            <select id="category" required>
              <option value="">აირჩიეთ კატეგორია</option>
              <option value="smartphones">Smartphones</option>
              <option value="laptops">Laptops</option>
              <option value="fragrances">Fragrances</option>
              <option value="groceries">Groceries</option>
            </select>
          </div>

          <div class="form-group">
            <label for="image">სურათის URL</label>
            <input
              type="url"
              id="image"
              placeholder="https://example.com/image.jpg"
              required
            />
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary">
            პროდუქტის დამატება
          </button>
        </form>
      </section>

      <section class="card-section">
        <h2>პროდუქტების სია</h2>
        <ul class="products-list"></ul>
      </section>
    </div>
  </body>
</html>
